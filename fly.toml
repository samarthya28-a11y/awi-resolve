# AWI Resolve connector — Fly.io config.
# Rename "app" to your chosen unique name before deploying (or let `fly launch` set it).
app = "awi-resolve-connector"
primary_region = "sin"  # Singapore — lowest latency to India; change if you prefer

[build]

[env]
  PORT = "8787"
  # State must NOT live in the image — Fly replaces the image on every deploy,
  # which would erase ticket balances and console tokens. Points at the volume
  # mounted below.
  RESOLVE_DATA_DIR = "/data"

# Ticket ledger, console tokens, device enrollments and session reports. This
# volume is the only reason a redeploy is safe.
#
# It must exist before the first deploy:
#   fly volumes create resolve_data --size 1 --region sin
#
# Fly does not replicate volumes. Snapshots are taken daily and kept 5 days;
# treat that as the recovery story, and take a manual snapshot before risky work.
[[mounts]]
  source = "resolve_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true          # agents connect over wss:// (TLS terminated at Fly's edge)
  # Always-on: the connector must hold customer WebSocket connections open, so it
  # must NOT sleep. Keep one machine running at all times.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
