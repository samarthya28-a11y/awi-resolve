<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AWI Resolve — Alpha Web IT Support</title>
<link rel="icon" href="/resolve-mark.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* Alpha Web brand system (from alphawebin.com globals.css) */
  :root {
    --brand-blue:#00aeef; --brand-magenta:#ad208e; --brand-green:#9ccb3b; --brand-orange:#f47521;
    --navy:#15213b; --navy-light:#1f3158; --ink:#1c2333; --muted:#5b667d;
    --line:#e6e9f0; --surface:#f6f8fc;
    --shadow-soft:0 10px 30px rgba(21,33,59,.08); --shadow-lift:0 24px 60px rgba(21,33,59,.14);
    --grad:linear-gradient(100deg,var(--brand-blue),var(--brand-magenta) 55%,var(--brand-orange));
    --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font-family:var(--font); background:#fff; color:var(--ink);
         line-height:1.6; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }

  header { display:flex; align-items:center; gap:12px; padding:14px 22px;
           background:rgba(255,255,255,.9); backdrop-filter:blur(10px);
           border-bottom:1px solid var(--line); box-shadow:var(--shadow-soft); z-index:5; }
  header img { width:38px; height:38px; }
  .brand { display:flex; flex-direction:column; line-height:1; }
  .brand strong { font-size:18px; font-weight:800; letter-spacing:-.01em; color:var(--navy); }
  .brand small { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.25em; color:var(--brand-orange); margin-top:3px; }
  .product { margin-left:14px; padding-left:14px; border-left:1px solid var(--line);
             font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .product .mark { width:22px; height:22px; flex:none; }
  .product .g { background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .status { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; background:#c7ceda; transition:.3s; }
  .dot.on { background:var(--brand-green); box-shadow:0 0 0 4px rgba(156,203,59,.2); }

  #feed { flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:12px; background:var(--surface); }
  .msg { max-width:86%; padding:11px 15px; border-radius:16px; white-space:pre-wrap; font-size:14.5px; box-shadow:var(--shadow-soft); }
  .me { align-self:flex-end; background:var(--brand-blue); color:#fff; border-bottom-right-radius:5px; font-weight:500; }
  .ai { align-self:flex-start; background:#fff; border:1px solid var(--line); color:var(--ink); border-bottom-left-radius:5px; }
  /* Decision notes (you approved / declined) — clear, not faint */
  .sys { align-self:center; color:var(--navy-light); font-size:12.5px; font-weight:600;
         background:var(--surface); border:1px solid var(--line); padding:5px 13px; border-radius:999px; box-shadow:none; }
  /* Single live status line (connecting / investigating) — updates in place */
  .status-line { align-self:center; display:flex; align-items:center; gap:9px; color:var(--navy-light);
                 font-size:13px; font-weight:600; background:#fff; border:1px solid var(--line);
                 padding:8px 16px; border-radius:999px; box-shadow:var(--shadow-soft); }
  .status-line .spin { width:13px; height:13px; border:2px solid var(--line); border-top-color:var(--brand-blue);
                       border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .divider { align-self:stretch; display:flex; align-items:center; gap:12px; color:var(--muted);
             font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; margin:6px 0; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--line); }
  .action { align-self:flex-start; display:flex; gap:8px; align-items:center; color:var(--navy-light);
            font-size:13px; font-weight:600; background:rgba(156,203,59,.12); border:1px solid rgba(156,203,59,.35);
            padding:8px 13px; border-radius:12px; }
  .action .tick { color:var(--brand-green); font-weight:800; }

  .report { align-self:stretch; background:#fff; border:1px solid var(--line); border-radius:16px;
            padding:6px 20px 16px; box-shadow:var(--shadow-lift); position:relative; overflow:hidden; }
  .report::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--grad); }
  .report h4 { margin:16px 0 3px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--brand-magenta); font-weight:800; }
  .report p { margin:0; color:var(--ink); font-size:14px; }

  .consent { align-self:stretch; background:#fff; border:1px solid var(--brand-orange);
             border-radius:16px; padding:16px 18px; box-shadow:0 12px 30px rgba(244,117,33,.16); }
  .consent .q { margin-bottom:14px; font-weight:600; color:var(--navy); }
  .consent .btns { display:flex; gap:10px; }
  button { font-family:inherit; font-size:14.5px; font-weight:700; border:0; border-radius:11px; padding:10px 20px; cursor:pointer; transition:transform .15s, box-shadow .15s, background .15s; }
  button:active { transform:translateY(1px); }
  .ok { background:var(--brand-green); color:#123; box-shadow:0 8px 20px rgba(156,203,59,.32); }
  .ok:hover { filter:brightness(1.03); transform:translateY(-1px); }
  .no { background:#fff; color:var(--muted); border:1px solid var(--line); }
  .no:hover { border-color:var(--muted); color:var(--ink); }
  .consent.answered { opacity:.55; }
  .consent.answered .btns { display:none; }

  footer { display:flex; gap:12px; padding:16px 22px; background:#fff; border-top:1px solid var(--line); position:relative; }
  footer.drag-over { outline:2px dashed var(--brand-blue); outline-offset:-6px; background:rgba(0,174,239,.06); }
  #box { flex:1; resize:none; font-family:inherit; font-size:14.5px; color:var(--ink);
         background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 15px; max-height:130px; }
  #box:focus { outline:none; border-color:var(--brand-blue); box-shadow:0 0 0 3px rgba(0,174,239,.15); }
  #box:disabled { opacity:.6; }
  .ghost { background:var(--surface); border:1px solid var(--line); color:var(--muted); font-size:17px; padding:11px 14px; }
  .ghost:hover { border-color:var(--brand-blue); color:var(--brand-blue); }
  #send { background:var(--brand-orange); color:#fff; box-shadow:0 8px 20px rgba(244,117,33,.28); padding:12px 24px; }
  #send:hover:not(:disabled) { transform:translateY(-1px); }
  #send:disabled { opacity:.5; cursor:default; box-shadow:none; }
  .shot { align-self:flex-end; max-width:min(320px,70%); border-radius:14px; border:1px solid var(--line);
          box-shadow:var(--shadow-soft); overflow:hidden; background:#fff; }
  .shot img { display:block; max-width:100%; max-height:220px; object-fit:contain; }
  .shot .cap { font-size:11.5px; font-weight:600; color:var(--muted); padding:6px 10px; border-top:1px solid var(--line); }
  ::-webkit-scrollbar { width:10px; } ::-webkit-scrollbar-thumb { background:#d3d9e4; border-radius:6px; border:3px solid var(--surface); }
</style>
</head>
<body>
  <header>
    <img src="/logo.svg" alt="Alpha Web" />
    <span class="brand"><strong>Alpha Web</strong><small>Innovations</small></span>
    <span class="product"><img class="mark" src="/resolve-mark.svg" alt="" /><span class="g">AWI Resolve</span> · Automated IT Support</span>
    <span class="status"><span class="dot" id="dot"></span><span id="host">connecting…</span></span>
  </header>
  <div id="feed"></div>
  <footer>
    <input type="file" id="file" accept=".txt,.md,.log,.csv,.json,.htm,.html,.png,.jpg,.jpeg,.gif,.webp" hidden />
    <button id="attach" class="ghost" title="Attach a manual, log, or a screenshot (or paste with Ctrl+V)">📎</button>
    <textarea id="box" rows="1" placeholder="Describe the problem — or paste a screenshot (Ctrl+V)…"></textarea>
    <button id="send">Get help</button>
  </footer>

<script>
const feed = document.getElementById('feed');
const box = document.getElementById('box');
const send = document.getElementById('send');
const dot = document.getElementById('dot');
const hostEl = document.getElementById('host');
let ws, busy = false;

function el(cls, text) {
  const d = document.createElement('div');
  d.className = cls; if (text != null) d.textContent = text;
  feed.appendChild(d); feed.scrollTop = feed.scrollHeight; return d;
}
function connect() {
  ws = new WebSocket('ws://' + location.host);
  ws.onopen = () => { dot.classList.add('on'); };
  ws.onclose = () => { dot.classList.remove('on'); hostEl.textContent = 'reconnecting…'; setTimeout(connect, 1500); };
  ws.onmessage = (e) => handle(JSON.parse(e.data));
}
// One live status line that updates in place, so "connecting/investigating"
// never piles up. Any real content or completion clears it.
let statusEl = null;
function setStatus(text) {
  if (!statusEl) {
    statusEl = document.createElement('div');
    statusEl.className = 'status-line';
    statusEl.innerHTML = '<span class="spin"></span><span class="t"></span>';
  }
  statusEl.querySelector('.t').textContent = text;
  feed.appendChild(statusEl); // move to bottom
  feed.scrollTop = feed.scrollHeight;
}
function clearStatus() { if (statusEl) { statusEl.remove(); statusEl = null; } }

function handle(m) {
  if (busy) armWatchdog(); // activity — reset the silence timer
  switch (m.type) {
    case 'hello': hostEl.textContent = m.hostname; break;
    case 'status': setStatus(m.text); break;
    case 'ai_message': clearStatus(); el('msg ai', m.text); break;
    case 'action': { clearStatus(); const d = el('action'); d.innerHTML = '<span class="tick">✓</span> ' + m.text; break; }
    case 'consent': clearStatus(); renderConsent(m); break;
    case 'selfcheck': clearStatus(); renderSelfCheck(m.result); break;
    case 'telemetry_ask': renderTelemetryAsk(); break;
    case 'telemetry_set':
      el('msg sys', m.allowed
        ? 'Health reporting is on. You can turn it off any time — just ask.'
        : 'Health reporting is off. Nothing about this PC is sent to Alpha Web.');
      break;
    case 'summary': clearStatus(); renderSummary(m.report); break;
    case 'done': clearStatus(); setBusy(false); break;
  }
}
function renderConsent(m) {
  const c = el('consent');
  c.innerHTML = '<div class="q"></div><div class="btns"><button class="ok">Yes, go ahead</button><button class="no">No</button></div>';
  c.querySelector('.q').textContent = m.prompt;
  c.querySelector('.ok').onclick = () => answer(c, m.consentId, 'accepted');
  c.querySelector('.no').onclick = () => answer(c, m.consentId, 'declined');
}
// Offline findings. Presented as observations with suggestions, never as a
// verdict — offline this is a short checklist, not the AI technician, and the
// wording has to keep that distinction visible.
function renderSelfCheck(r) {
  const d = el('msg ai');
  const esc = (s) => String(s == null ? '' : s)
    .replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  let html = '<strong>Offline check of this PC</strong><br><br>';
  if (r.findings.length) {
    for (const f of r.findings) {
      html += `<div style="margin:0 0 12px">
        <strong>${esc(f.title)}</strong><br>
        <span style="opacity:.85">${esc(f.observed)}</span>
        <ul style="margin:6px 0 0 18px;padding:0">${f.advice.map((a) => `<li>${esc(a)}</li>`).join('')}</ul>
      </div>`;
    }
  }
  html += `<div style="opacity:.8;font-size:13px">${esc(r.note)}</div>`;
  d.innerHTML = html;
}

// Shown once, before anything about this PC leaves it. Says plainly what is
// sent and what is not — a vague "we collect usage data" is the wording that
// makes people distrust a security product, and specifics cost nothing.
function renderTelemetryAsk() {
  const c = el('consent');
  c.innerHTML =
    '<div class="q"><strong>Before we start — may Resolve send Alpha Web a health summary of this PC?</strong><br><br>'
    + '<strong>What is sent:</strong> this PC\'s name, Windows version, whether antivirus and firewall are on, '
    + 'how many security detections and pending updates there are, and free disk and memory. '
    + 'It helps us spot problems early and improve the product.<br><br>'
    + '<strong>What is never sent:</strong> your files, emails, documents, passwords, or anything you type here.'
    + '<br><br>Resolve works exactly the same either way. You can change your mind at any time.</div>'
    + '<div class="btns"><button class="ok">Yes, that\'s fine</button><button class="no">No thanks</button></div>';
  c.querySelector('.ok').onclick = () => telemetryAnswer(c, true);
  c.querySelector('.no').onclick = () => telemetryAnswer(c, false);
}
function telemetryAnswer(c, allowed) {
  ws.send(JSON.stringify({ type: 'telemetry_choice', allowed }));
  c.classList.add('answered');
}
function answer(c, consentId, decision) {
  ws.send(JSON.stringify({ type: 'consent_response', consentId, decision }));
  c.classList.add('answered');
  el('msg sys', decision === 'accepted' ? 'You approved the action.' : 'You declined the action.');
}
function renderSummary(r) {
  const parts = { DIAGNOSIS:'', EVIDENCE:'', FIX:'', OUTCOME:'', CONFIDENCE:'' };
  let cur = null;
  r.split('\n').forEach(line => {
    const mm = line.match(/^(DIAGNOSIS|EVIDENCE|FIX|OUTCOME|CONFIDENCE)\s*:\s*(.*)$/);
    if (mm) { cur = mm[1]; parts[cur] = mm[2]; } else if (cur) { parts[cur] += '\n' + line; }
  });
  const box = el('report');
  const order = ['DIAGNOSIS','FIX','OUTCOME','EVIDENCE','CONFIDENCE'];
  const labels = { DIAGNOSIS:'What was wrong', FIX:'What was done', OUTCOME:'Result',
                   EVIDENCE:'How I checked', CONFIDENCE:'Confidence' };
  let html = '';
  order.forEach(k => { if (parts[k] && parts[k].trim()) html += '<h4>'+labels[k]+'</h4><p>'+parts[k].trim().replace(/</g,'&lt;')+'</p>'; });
  box.innerHTML = html || ('<p>'+r.replace(/</g,'&lt;')+'</p>');
}
// Watchdog: if nothing arrives for a while during a request, don't spin
// forever — tell the customer and let them retry. Reset on every message.
let watchdog = null;
function armWatchdog() {
  clearTimeout(watchdog);
  watchdog = setTimeout(() => {
    if (busy) {
      setStatus('This is taking longer than expected — the connection may have dropped. Click "Get help" to try again.');
      setBusy(false);
    }
  }, 120000);
}
function setBusy(b) {
  busy = b; send.disabled = b; send.textContent = b ? 'Working…' : 'Get help';
  // Keep the box editable so users can still paste screenshots / type while waiting.
  box.placeholder = b
    ? 'Working… you can still paste a screenshot (Ctrl+V) or type notes'
    : 'Describe the problem — or paste a screenshot (Ctrl+V)…';
  if (b) armWatchdog(); else clearTimeout(watchdog);
}
function submit() {
  const text = box.value.trim();
  if (!text || busy) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    setStatus('Still connecting to the support service — one moment…');
    return;
  }
  clearStatus();
  if (feed.querySelector('.msg, .report')) { const d = el('divider'); d.textContent = 'New request'; }
  el('msg me', text);
  ws.send(JSON.stringify({ type: 'open_ticket', text }));
  box.value = ''; setBusy(true);
}
send.onclick = submit;
box.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } };

// Attach a manual / guide / screenshot. Works before OR during a request.
// Screenshots: paperclip, Ctrl+V paste into the chat box, or drag-and-drop.
// Setup installers (.exe/.msi) are NOT accepted — ask Resolve to download them.
const fileInput = document.getElementById('file');
const footer = document.querySelector('footer');
document.getElementById('attach').onclick = () => fileInput.click();
fileInput.accept = '.pdf,.txt,.md,.log,.csv,.json,.png,.jpg,.jpeg,.gif,.webp,text/plain,application/pdf,image/*';

function showShotPreview(dataUrl, label) {
  const wrap = document.createElement('div');
  wrap.className = 'shot';
  const img = document.createElement('img');
  img.src = dataUrl;
  img.alt = label || 'Screenshot';
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.textContent = label || 'Screenshot attached';
  wrap.appendChild(img);
  wrap.appendChild(cap);
  feed.appendChild(wrap);
  feed.scrollTop = feed.scrollHeight;
}

function attachFile(f, sourceLabel) {
  if (!f) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    el('msg sys', 'Still connecting — please try attaching again in a moment.');
    return;
  }
  const name = (f.name || sourceLabel || 'screenshot.png').toLowerCase();
  const isInstaller = /\.(exe|msi|msix|dmg|pkg|bat|cmd|ps1|zip|7z|rar)$/i.test(name);
  if (isInstaller) {
    el('msg sys', 'Do not attach setup/installer files. Describe what to install (or paste the official HTTPS download link) and press Get help — Resolve will download and install it with your approval.');
    return;
  }
  const isImage = /^image\//.test(f.type) || /\.(png|jpe?g|gif|webp)$/i.test(name) || (!f.name && /^image\//.test(f.type));
  const isPdf = f.type === 'application/pdf' || name.endsWith('.pdf');
  const maxBytes = isImage ? 8 * 1024 * 1024 : 25 * 1024 * 1024;
  if (f.size > maxBytes) {
    el('msg sys', isImage
      ? 'That image is too large (max 8 MB). Please attach a smaller screenshot.'
      : 'That document is too large (max 25 MB). Please attach a smaller manual, or a text export of the key pages.');
    return;
  }
  const displayName = f.name || sourceLabel || 'screenshot.png';
  el('msg sys', 'Reading "' + displayName + '"…');
  const reader = new FileReader();
  reader.onload = () => {
    if (isImage) {
      const s = String(reader.result || '');
      const data = s.slice(s.indexOf(',') + 1);
      const mediaType = (f.type && f.type.startsWith('image/')) ? f.type : 'image/png';
      ws.send(JSON.stringify({ type: 'attach_image', mediaType, data }));
      showShotPreview(s, 'Screenshot attached — describe what you see and press Get help');
    } else if (isPdf) {
      const buf = reader.result;
      const bytes = new Uint8Array(buf);
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      const data = btoa(binary);
      ws.send(JSON.stringify({ type: 'attach_manual', title: displayName, encoding: 'pdf-base64', data }));
      el('msg sys', 'Manual attached — describe the problem and press "Get help".');
    } else {
      ws.send(JSON.stringify({ type: 'attach_manual', title: displayName, text: String(reader.result || '') }));
      el('msg sys', 'Document attached — describe the problem and press "Get help".');
    }
  };
  reader.onerror = () => { el('msg sys', "Sorry, that file couldn't be read."); };
  if (isImage) reader.readAsDataURL(f);
  else if (isPdf) reader.readAsArrayBuffer(f);
  else reader.readAsText(f);
}

fileInput.onchange = () => {
  const f = fileInput.files && fileInput.files[0];
  fileInput.value = '';
  if (f) attachFile(f);
};

// Paste a screenshot (Win+Shift+S → Ctrl+V) anywhere in the window / chat box.
document.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (it.kind === 'file' && /^image\//.test(it.type)) {
      e.preventDefault();
      const blob = it.getAsFile();
      if (!blob) return;
      // Clipboard images often have no filename — give one so size/type checks work.
      const file = new File([blob], 'screenshot.' + (it.type.split('/')[1] || 'png'), { type: it.type || 'image/png' });
      attachFile(file, 'pasted screenshot');
      return;
    }
  }
});

// Drag-and-drop onto the composer (or the whole window).
function hasFiles(e) {
  const types = e.dataTransfer && e.dataTransfer.types;
  return types && (types.contains ? types.contains('Files') : Array.from(types).includes('Files'));
}
['dragenter', 'dragover'].forEach((ev) => {
  window.addEventListener(ev, (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    footer.classList.add('drag-over');
  });
});
['dragleave', 'drop'].forEach((ev) => {
  window.addEventListener(ev, (e) => {
    if (ev === 'drop' && hasFiles(e)) e.preventDefault();
    footer.classList.remove('drag-over');
  });
});
window.addEventListener('drop', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  footer.classList.remove('drag-over');
  const files = e.dataTransfer && e.dataTransfer.files;
  if (!files || !files.length) return;
  attachFile(files[0]);
});

connect();
</script>
</body>
</html>
